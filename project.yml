name: LuisearchIOS
options:
  bundleIdPrefix: com.luishae
targets:
  LuisearchIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - LuisearchIOS
    info:
      path: LuisearchIOS/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Luisearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luishae.luisearchios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
